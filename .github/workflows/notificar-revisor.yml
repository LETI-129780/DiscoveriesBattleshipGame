name: Notificar revisor

on:
  pull_request:
    types: [review_requested]

permissions:
  pull-requests: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Comentar a mencionar o revisor
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const revisor = context.payload.requested_reviewer;
            const equipa = context.payload.requested_team;

            const mencao = revisor
              ? `@${revisor.login}`
              : `@${context.repo.owner}/${equipa.slug}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `Olá ${mencao}, foste indicado(a) para rever este Pull Request ("${pr.title}") de @${pr.user.login}. Por favor, vê o separador **Files changed**.`
            });
